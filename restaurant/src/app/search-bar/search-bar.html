<div class="search">
    <i class="fa-solid fa-magnifying-glass search__icon" aria-hidden="true"></i> <!-- https://fontawesome.com/icons/magnifying-glass -->

    <input
        #field
        class="input search__input"
        type="search"
        enterkeyhint="search"
        autocomplete="off"
        [placeholder]="placeholder()"
        [attr.aria-label]="label()"
        [value]="value()"
        (input)="value.set(field.value)"
        (keydown.escape)="value() && clear()"
    >

    @if(value()) {
        <button type="button" class="search__clear" aria-label="Vymazať vyhľadávanie" (click)="clear()">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i> <!-- https://fontawesome.com/icons/xmark -->
        </button>
    }
</div>
