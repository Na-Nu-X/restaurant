<header class="header" [class.is-scrolled]="is_scrolled()" [class.is-menu-open]="is_menu_open()">
    <div class="header__inner">
        <a class="logo" routerLink="/" [attr.aria-label]="brand.name + ' – úvod'" (click)="onLogoClick()">
            @if(brand.logo) {
                <img class="logo__image" [src]="brand.logo.src" [alt]="brand.logo.alt">
            } @else {
                <span class="logo__name">{{ brand.name }}</span>
            }
        </a>

        <nav class="nav" aria-label="Hlavná navigácia">
            <ul class="nav__list" role="list">
                @for(link of links; track link.id) {
                    <li><a class="nav__link" [href]="'/#' + link.id" (click)="go(link.id, $event)">{{ link.label }}</a></li>
                }
            </ul>
        </nav>

        <div class="header__actions">
            <app-status-badge class="header__status" [status]="status()" [compact]="true"></app-status-badge>

            <button
                type="button"
                class="cart-button"
                [attr.aria-label]="'Košík, počet položiek: ' + cart_count()"
                (click)="openCart()"
            >
                <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i> <!-- https://fontawesome.com/icons/bag-shopping -->
                <span class="cart-button__label">Košík</span>

                @if(cart_count() > 0) {
                    <span class="cart-button__count" aria-hidden="true">{{ cart_count() }}</span>
                }
            </button>

            <a class="btn btn--primary header__cta" [href]="'/#' + sections.menu" (click)="go(sections.menu, $event)">Objednať</a>

            <button
                type="button"
                class="icon-btn header__toggle"
                aria-controls="mobile-menu"
                [attr.aria-expanded]="is_menu_open()"
                [attr.aria-label]="is_menu_open() ? 'Zavrieť menu' : 'Otvoriť menu'"
                (click)="toggleMenu()"
            >
                <i class="fa-solid" [class.fa-bars]="!is_menu_open()" [class.fa-xmark]="is_menu_open()" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</header>

<!-- Mobile Menu (Below The Header, Hidden From 768px Up) -->
<div class="mobile-menu__backdrop" [class.is-open]="is_menu_open()" (click)="closeMenu()" aria-hidden="true"></div>

<div
    id="mobile-menu"
    class="mobile-menu"
    [class.is-open]="is_menu_open()"
    [attr.inert]="is_menu_open() ? null : ''"
    [attr.aria-hidden]="!is_menu_open()"
>
    <app-status-badge [status]="status()" size="lg"></app-status-badge>

    <nav aria-label="Mobilná navigácia">
        <ul class="mobile-menu__list" role="list">
            @for(link of links; track link.id) {
                <li>
                    <a class="mobile-menu__link" [href]="'/#' + link.id" (click)="go(link.id, $event)">
                        <i [class]="link.icon" aria-hidden="true"></i>
                        <span>{{ link.label }}</span>
                        <i class="fa-solid fa-chevron-right mobile-menu__chevron" aria-hidden="true"></i>
                    </a>
                </li>
            }
        </ul>
    </nav>

    <div class="mobile-menu__footer">
        <a class="btn btn--primary btn--lg btn--block" [href]="'/#' + sections.menu" (click)="go(sections.menu, $event)">
            Objednať online
        </a>

        <a class="btn btn--secondary btn--block" [href]="'tel:' + brand.contact.phone">
            <i class="fa-solid fa-phone" aria-hidden="true"></i> {{ brand.contact.phoneDisplay }}
        </a>

        <p class="mobile-menu__address">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            {{ brand.address.street }}, {{ brand.address.city }}
        </p>
    </div>
</div>
