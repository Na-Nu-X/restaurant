<div class="filters" role="toolbar" aria-label="Filtrovať podľa kategórie">
    <button
        type="button"
        class="chip"
        [class.is-active]="selected() === null"
        [attr.aria-pressed]="selected() === null"
        (click)="selected.set(null)"
    >
        Všetko
    </button>

    @for(group of groups(); track group.id) {
        @if(group.categories.length > 0) {
            <span class="filters__divider" aria-hidden="true"></span>

            <div class="filters__group" role="group" [attr.aria-label]="group.name">
                <span class="filters__group-label" aria-hidden="true">{{ group.name }}</span>

                @for(category of group.categories; track category.id) {
                    <button
                        type="button"
                        class="chip"
                        [class.is-active]="selected() === category.id"
                        [attr.aria-pressed]="selected() === category.id"
                        (click)="select(category.id)"
                    >
                        @if(icon(category); as icon_class) {
                            <i [class]="icon_class" aria-hidden="true"></i>
                        }
                        {{ label(category) }}
                    </button>
                }
            </div>
        }
    }
</div>
